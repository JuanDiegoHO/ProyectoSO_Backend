# se usa en la VM de Azure junto a un archivo .env con los valores reales
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql solo se ejecuta la primera vez (con el volumen vacio)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # sin puertos publicados (solo el backend llega a la base por la red de compose)
    restart: unless-stopped

  backend:
    image: yexg/so-backend:1.0
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ORIGEN_PERMITIDO: ${ORIGEN_PERMITIDO}
    # solo en 127.0.0.1 para que desde internet se entre unicamente por nginx
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
