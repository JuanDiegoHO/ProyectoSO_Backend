# va en /etc/nginx/sites-available/api de la VM de Azure
# subdominio de la API asignado por el docente
# certbot --nginx agrega despues el bloque de HTTPS
server {
    listen 80;
    server_name api-sanjuan.scaleautomatization.tech;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
